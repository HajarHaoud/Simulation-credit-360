# Activer avec : SPRING_PROFILES_ACTIVE=postgres
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit360}
    username: ${DB_USER:credit360}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

app:
  jwt:
    secret: ${JWT_SECRET}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  admin:
    # Création du premier administrateur si la base est vide (hors données de démo).
    initial-email: ${ADMIN_EMAIL:}
    initial-password: ${ADMIN_PASSWORD:}
